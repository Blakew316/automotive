<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Shop management for independent auto repair: estimates and approvals, workflow, digital inspections, customer texting, online booking, time clock, parts and purchase orders, payments, accounting and reports." />
    <meta name="theme-color" content="#eff1f4" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="AutoShop" />
    <title>AutoShop Pro</title>
    <script>
      // Apply the saved appearance (light unless chosen otherwise) before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('autoshop-pro:appearance');
        if (t !== 'light' && t !== 'dark' && t !== 'system') t = localStorage.getItem('autoshop-pro:theme') === 'dark' ? 'dark' : 'light';
        if (t !== 'system') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
