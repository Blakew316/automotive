<section class="cta-road" aria-labelledby="cta-road-title">
  <div class="container cta-road-inner">
    <div class="cta-road-copy" data-reveal>
      <p class="eyebrow">Ready when you are</p>
      <h2 id="cta-road-title">See your own shop day in it.</h2>
      <p class="lead">Request a demo and we&rsquo;ll get back to you, or try the sample shop right now.</p>
    </div>
    <div class="cta-road-actions" data-reveal>
      <a class="btn btn-primary btn-lg" href="{{root}}demo.html"><svg class="icon" aria-hidden="true"><use href="#i-calendar-check"/></svg>Request a demo</a>
      <a class="btn btn-secondary btn-lg" href="{{root}}app/" data-no-prerender><svg class="icon" aria-hidden="true"><use href="#i-board"/></svg>Try the sample shop</a>
    </div>
  </div>
  <div class="road" aria-hidden="true">
    <span class="road-status"><span class="road-status-wip">In progress</span><span class="road-status-paid">Paid &middot; RO closed</span></span>
    <div class="road-surface"><span class="road-dashes"></span></div>
    <svg class="road-car" viewBox="0 0 32 14"><use href="#i-car-mini"/></svg>
  </div>
</section>
