<section class="cta-road" aria-labelledby="cta-road-title">
  <div class="container cta-road-inner">
    <div class="cta-road-copy" data-reveal>
      <p class="eyebrow">Ready when you are</p>
      <h2 id="cta-road-title">Let&rsquo;s get you back on the road.</h2>
      <p class="lead">Request an appointment in about a minute, or give us a call. We&rsquo;ll confirm a time and take it from there.</p>
    </div>
    <div class="cta-road-actions" data-reveal>
      <a class="btn btn-primary btn-lg" href="{{root}}appointment.html"><svg class="icon" aria-hidden="true"><use href="#i-calendar-check"/></svg>Book a service</a>
      <a class="btn btn-secondary btn-lg" href="tel:{{tel}}"><svg class="icon" aria-hidden="true"><use href="#i-phone"/></svg>{{phone}}</a>
    </div>
  </div>
  <div class="road" aria-hidden="true">
    <div class="road-surface"><span class="road-dashes"></span></div>
    <svg class="road-car" viewBox="0 0 32 14"><use href="#i-car-mini"/></svg>
  </div>
</section>
