<nav class="tabbar" aria-label="Quick navigation">
  <a class="tab" href="{{root}}index.html" data-nav="home"><svg class="icon" aria-hidden="true"><use href="#i-home"/></svg><span>Home</span></a>
  <a class="tab" href="{{root}}features.html" data-nav="features"><svg class="icon" aria-hidden="true"><use href="#i-grid"/></svg><span>Features</span></a>
  <a class="tab tab-book" href="{{root}}demo.html" data-nav="demo"><span class="tab-book-dot"><svg class="icon" aria-hidden="true"><use href="#i-calendar-check"/></svg></span><span>Get a demo</span></a>
  <a class="tab" href="{{root}}mobile.html" data-nav="mobile"><svg class="icon" aria-hidden="true"><use href="#i-device-phone"/></svg><span>iPhone</span></a>
  <button class="tab" type="button" data-open-sheet="more-sheet" aria-haspopup="dialog" aria-controls="more-sheet" aria-expanded="false"><svg class="icon" aria-hidden="true"><use href="#i-menu"/></svg><span>More</span></button>
</nav>
<dialog class="sheet" id="more-sheet" aria-labelledby="more-sheet-title">
  <div class="sheet-panel">
    <div class="sheet-grabber" aria-hidden="true"></div>
    <div class="sheet-head">
      <h2 id="more-sheet-title">{{name}}</h2>
      <button class="icon-btn" type="button" data-close-sheet aria-label="Close menu" autofocus><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button>
    </div>
    <div class="sheet-quick">
      <a class="quick-action is-primary" href="{{root}}demo.html"><svg class="icon" aria-hidden="true"><use href="#i-calendar-check"/></svg><span>Request a demo</span></a>
      <a class="quick-action" href="{{root}}app/" data-no-prerender><svg class="icon" aria-hidden="true"><use href="#i-board"/></svg><span>Try the sample shop</span></a>
      <a class="quick-action" href="{{root}}app/signin" data-no-prerender><svg class="icon" aria-hidden="true"><use href="#i-key"/></svg><span>Sign in</span></a>
    </div>
    <h3 class="sheet-label">Explore</h3>
    <ul class="sheet-grid">
      <li><a href="{{root}}index.html" data-nav="home"><svg class="icon" aria-hidden="true"><use href="#i-home"/></svg>Home</a></li>
      <li><a href="{{root}}features.html" data-nav="features"><svg class="icon" aria-hidden="true"><use href="#i-grid"/></svg>Features</a></li>
      <li><a href="{{root}}mobile.html" data-nav="mobile"><svg class="icon" aria-hidden="true"><use href="#i-device-phone"/></svg>iPhone &amp; iPad</a></li>
      <li><a href="{{root}}works-with.html" data-nav="integrations"><svg class="icon" aria-hidden="true"><use href="#i-link"/></svg>Integrations</a></li>
      <li><a href="{{root}}security.html" data-nav="security"><svg class="icon" aria-hidden="true"><use href="#i-shield"/></svg>Security</a></li>
      <li><a href="{{root}}about.html" data-nav="about"><svg class="icon" aria-hidden="true"><use href="#i-info"/></svg>About</a></li>
      <li><a href="{{root}}faq.html" data-nav="faq"><svg class="icon" aria-hidden="true"><use href="#i-question"/></svg>FAQ</a></li>
      <li><a href="{{root}}privacy.html" data-nav="privacy"><svg class="icon" aria-hidden="true"><use href="#i-lock"/></svg>Privacy</a></li>
    </ul>
    <h3 class="sheet-label">Features</h3>
    <ul class="sheet-list">
{{featuresSheet}}
    </ul>
    <div class="sheet-foot">
      {{motionToggle}}
    </div>
  </div>
</dialog>
